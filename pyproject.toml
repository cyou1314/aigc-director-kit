[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-director-kit"
version = "0.1.4"
description = "Deterministic contracts for AI animation shot planning and action selection."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AIGC Director Kit contributors" }]
keywords = ["aigc", "storyboard", "shot-planning", "blender", "animation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
aigc-director-kit = "aigc_director_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aigc_director_kit = ["py.typed"]
