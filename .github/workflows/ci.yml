name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --no-deps -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate public examples
        run: |
          python -m aigc_director_kit verify-examples --json
          python -m aigc_director_kit validate-plan examples/shot_plan.json --json
          python -m aigc_director_kit validate-plan examples/one_take_previs_case.json --json
          python -m aigc_director_kit validate-plan examples/film_contract_handoff_case.json --json
          python -m aigc_director_kit validate-plan examples/multi_actor_prop_case.json --json
          python -m aigc_director_kit list-actions --library examples/action_library.json --query run
          python -m aigc_director_kit compile-action --library examples/action_library.json --text "run quick stop, blend 0.2s, fast, in place"

      - name: Validate workflow, prompt, and QC contracts
        run: |
          python -m aigc_director_kit validate-workflow examples/skill_workflow_case.json --library examples/action_library.json --json
          python -m aigc_director_kit validate-prompt-pack examples/prompt_pack_case.json --plan examples/one_take_previs_case.json --json
          python -m aigc_director_kit validate-qc-report examples/qc_report_unverified_case.json --json
          python -m aigc_director_kit build-runtime-handoff examples/skill_workflow_case.json --library examples/action_library.json --adapter optional-runtime-adapter --json

      - name: Check source and JSON files
        run: |
          python -m compileall -q src tests
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("examples").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("schemas").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("JSON examples and schemas parsed successfully")
          PY
